apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-migrations
  namespace: fcg
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: migrations
        image: fcg-catalog-migrations:local
        imagePullPolicy: IfNotPresent
        env:
        - name: CATALOG_MIGRATIONS_CONNECTION
          valueFrom:
            secretKeyRef:
              name: fcg-domain-dev-secrets
              key: catalog-connection-string
        envFrom:
        - configMapRef:
            name: fcg-catalog-migrations-config
