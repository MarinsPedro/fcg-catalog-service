apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  namespace: fcg
spec:
  selector:
    app: catalog-api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  namespace: fcg
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog-api
  template:
    metadata:
      labels:
        app: catalog-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: catalog-api
        image: fcg-catalog-api:local
        imagePullPolicy: IfNotPresent
        env:
        - name: ConnectionStrings__Database
          valueFrom:
            secretKeyRef:
              name: fcg-domain-dev-secrets
              key: catalog-connection-string
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 750m
            memory: 768Mi
        ports:
        - name: http
          containerPort: 8080
        startupProbe:
          httpGet:
            path: /health/live
            port: 8080
          periodSeconds: 5
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 6
        envFrom:
        - configMapRef:
            name: fcg-catalog-api-config
